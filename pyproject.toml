[project]
name = "investment-science"
version = "0.1.0"
description = "Exercises from \"Investment Science\" (International Edition) - David Luenberger"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "ruff>=0.15.15",
    "sympy>=1.14.0",
    "ty>=0.0.42",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
